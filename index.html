<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصول - لكل السودان</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100">
<div class="max-w-6xl mx-auto p-3">
<header class="bg-white rounded-2xl shadow-sm p-4 mb-3 flex justify-between items-center">
<h1 class="font-bold text-green-800">وصول - لكل السودان 🇸🇩</h1>
<div class="flex gap-2">
<button onclick="addAdmin()" class="bg-gray-800 text-white px-3 py-2 rounded-xl text-xs">👥 إضافة زميل</button>
<button onclick="openAddModal()" class="bg-green-700 text-white px-4 py-2 rounded-xl text-sm">+ إضافة أسرة</button>
</div>
</header>
<div class="grid grid-cols-3 gap-2 mb-3">
<div class="bg-white rounded-2xl p-3 text-center"><p class="text-xs">إجمالي الأسر</p><h2 id="totalFamilies" class="font-bold">0</h2></div>
<div class="bg-white rounded-2xl p-3 text-center"><p class="text-xs">تم التوزيع</p><h2 id="distributed" class="font-bold">0</h2></div>
<div class="bg-white rounded-2xl p-3 text-center"><p class="text-xs">قيد الانتظار</p><h2 id="pending" class="font-bold">0</h2></div>
</div>
<select id="stateFilter" onchange="filterByState()" class="bg-white rounded-xl px-3 py-2 text-sm border mb-2"><option value="">كل الولايات</option><option>الخرطوم</option><option>النيل الأبيض</option><option>الجزيرة</option><option>دارفور</option><option>كسلا</option></select>
<div id="map" class="w-full h-[400px] rounded-xl mb-3 bg-white"></div>
<div class="bg-white rounded-2xl p-3 mb-3"><h3 class="font-bold text-sm mb-2">📍 كل الولايات</h3><div id="recentList"></div></div>
<div class="bg-white rounded-2xl p-3"><input id="search" onkeyup="filterTable()" placeholder="ابحث..." class="border rounded-xl px-3 py-1.5 text-xs w-full mb-2"><table class="w-full text-xs"><thead class="bg-gray-50"><tr><th class="p-2 text-right">الاسم</th><th class="p-2 text-right">الولاية</th><th class="p-2 text-right">الإجراءات</th></tr></thead><tbody id="familyTable"></tbody></table></div>
</div>
<div id="addModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 class="font-bold mb-4">إضافة أسرة</h3><input id="fName" placeholder="اسم رب الأسرة" class="w-full border rounded-xl p-2 mb-2 text-sm"><input id="fPhone" placeholder="رقم الهاتف" class="w-full border rounded-xl p-2 mb-2 text-sm"><select id="fState" class="w-full border rounded-xl p-2 mb-3 text-sm"><option>الخرطوم</option><option>النيل الأبيض</option><option>الجزيرة</option></select><div class="flex gap-2"><button onclick="addFamily()" class="flex-1 bg-green-700 text-white py-2 rounded-xl">حفظ</button><button onclick="closeAddModal()" class="flex-1 bg-gray-200 py-2 rounded-xl">إلغاء</button></div></div></div>
<script>
const supabaseClient = window.supabase.createClient('https://lczzagazggzhzjmqapmo.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjenphZ2F6Z2d6aHpqbXFhcG1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgyODQ1MzQsImV4cCI6MjA3Mzg2MDUzNH0.mqW5NhHq5CWDy1o7mQqejlEoRzVezQ1b0xN3pJzZzXc');
let map, allData=[];
function initMap(){map=L.map('map').setView([15.5,32.5],5); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);}
async function loadData(){
const {data}=await supabaseClient.from('families').select('*').order('created_at',{ascending:false});
if(!data) return; allData=data;
document.getElementById('totalFamilies').innerText=data.length;
document.getElementById('distributed').innerText=data.filter(d=>d.status=='done').length;
document.getElementById('pending').innerText=data.filter(d=>d.status!='done').length;
document.getElementById('familyTable').innerHTML=data.map(f=>`<tr class="border-t"><td class="p-2">${f.name}</td><td class="p-2">${f.state||''}</td><td class="p-2 flex gap-1"><button onclick="editFamily('${f.id}','${f.name}')" class="bg-blue-600 text-white px-2 py-1 rounded text-[10px]">تعديل</button><button onclick="deleteFamily('${f.id}')" class="bg-red-600 text-white px-2 py-1 rounded text-[10px]">حذف</button><button onclick="printCard('${f.id}','${f.name}','${f.state||''}')" class="bg-green-700 text-white px-2 py-1 rounded text-[10px]">بطاقة</button></td></tr>`).join('');
document.getElementById('recentList').innerHTML=data.slice(0,10).map(f=>`<div class="flex justify-between border-b py-2"><div><p class="font-bold text-xs">${f.name}</p><p class="text-[11px]">${f.state||''}</p></div><div class="flex gap-1"><button onclick="editFamily('${f.id}','${f.name}')" class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-[10px]">تعديل</button><button onclick="deleteFamily('${f.id}')" class="bg-red-50 text-red-600 px-2 py-1 rounded text-[10px]">حذف</button><button onclick="printCard('${f.id}','${f.name}','${f.state||''}')" class="bg-green-50 text-green-700 px-2 py-1 rounded text-[10px]">بطاقة</button></div></div>`).join('');
}
function filterTable(){const q=document.getElementById('search').value.toLowerCase();const filtered=allData.filter(f=>f.name.toLowerCase().includes(q));document.getElementById('familyTable').innerHTML=filtered.map(f=>`<tr class="border-t"><td class="p-2">${f.name}</td><td class="p-2">${f.state}</td><td class="p-2 flex gap-1"><button onclick="editFamily('${f.id}','${f.name}')" class="bg-blue-600 text-white px-2 py-1 rounded text-[10px]">تعديل</button><button onclick="deleteFamily('${f.id}')" class="bg-red-600 text-white px-2 py-1 rounded text-[10px]">حذف</button><button onclick="printCard('${f.id}','${f.name}','${f.state}')" class="bg-green-700 text-white px-2 py-1 rounded text-[10px]">بطاقة</button></td></tr>`).join('');}
function filterByState(){const s=document.getElementById('stateFilter').value;if(!s){loadData();return;}const filtered=allData.filter(f=>f.state==s);document.getElementById('familyTable').innerHTML=filtered.map(f=>`<tr class="border-t"><td class="p-2">${f.name}</td><td class="p-2">${f.state}</td><td class="p-2"><button onclick="printCard('${f.id}','${f.name}','${f.state}')" class="bg-green-700 text-white px-2 py-1 rounded text-[10px]">بطاقة</button></td></tr>`).join('');}
function openAddModal(){document.getElementById('addModal').classList.remove('hidden');document.getElementById('addModal').classList.add('flex');}
function closeAddModal(){document.getElementById('addModal').classList.add('hidden');document.getElementById('addModal').classList.remove('flex');}
async function addFamily(){const name=document.getElementById('fName').value;const phone=document.getElementById('fPhone').value;const state=document.getElementById('fState').value;if(!name)return alert('اكتب الاسم');await supabaseClient.from('families').insert([{name,phone,state,status:'pending'}]);closeAddModal();loadData();}
async function deleteFamily(id){if(!confirm('حذف؟'))return;await supabaseClient.from('families').delete().eq('id',id);loadData();}
async function editFamily(id,oldName){let n=prompt('الاسم الجديد:',oldName);if(!n)return;await supabaseClient.from('families').update({name:n}).eq('id',id);loadData();}
function printCard(id,name,state){let w=window.open('','_blank');w.document.write(`<html dir="rtl"><body style="text-align:center;font-family:sans-serif"><div style="border:3px solid #1B5E20;border-radius:20px;padding:20px;width:360px;margin:auto"><h2 style="color:#1B5E20">وصول - بطاقة مستفيد</h2><h3>${name}</h3><p>${state}</p><p>رقم: ${id.slice(0,8)}</p><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${id}"><br><button onclick="window.print()">طباعة</button></div></body></html>`);}
async function addAdmin(){let name=prompt('اسم الزميل:');let phone=prompt('رقم الهاتف:');if(!name||!phone)return;const {error}=await supabaseClient.from('admins').insert([{name,phone}]);if(error)alert(error.message);else alert('تمت إضافة '+name);}
window.onload=()=>{initMap();loadData();}
</script>
</body>
</html>
